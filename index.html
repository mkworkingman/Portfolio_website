<!doctype html>
<!-- TODO: lang should change based on language. en by default -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>portfolio_website</title>
        <!-- TODO: remove unused fonts -->
        <link
            rel="preload"
            href="/fonts/montserrat-latin-400-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="./src/styles/index.scss" />
        <script type="module" defer src="./src/scripts/index.ts"></script>
    </head>
    <!-- TODO: Semantic, Accessibility -->
    <body>
        <header class="header">
            <p class="header-logo" role="img" aria-label="MKalinin logo">
                &lt;<span>MKalinin /</span>&gt;
            </p>
            <button class="header-contact" data-i18n="navContact">Contact Me</button>
            <div class="lang">
                <button class="lang__switcher">EN</button>
                <ul class="lang__list">
                    <li data-lang="en">EN</li>
                    <li data-lang="ru">RU</li>
                    <li data-lang="sr">SR</li>
                </ul>
            </div>
            <button class="header-nav-toggle">X</button>
            <nav class="header-nav">
                <ul class="header-nav__links">
                    <!-- TODO: By default those texts should be in English. After adding it write test, compare initial English load and changing to English -->
                    <li><a class="header-nav__link" href="#home" data-i18n="navHome"></a></li>
                    <li><a class="header-nav__link" href="#about" data-i18n="navAbout"></a></li>
                    <li><a class="header-nav__link" href="#skills" data-i18n="navSkills"></a></li>
                    <li>
                        <a class="header-nav__link" href="#projects" data-i18n="navProjects"></a>
                    </li>
                </ul>
            </nav>
        </header>
        <main class="main">
            <section class="hero" id="home" aria-labelledby="hero-heading">
                <h1 id="hero-heading">Maksim Kalinin</h1>
                <p class="hero-subtitle">Senior Fullstack (FE focused)/Frontend Developer</p>
                <ul>
                    <li>Frontend: React, Next.js, Vue, Nuxt, TypeScript</li>
                    <li>Backend: PHP (Laravel), Node (Express), Python (Django)</li>
                </ul>
            </section>
            <section id="about"></section>
            <section id="skills"></section>
            <section id="projects"></section>
        </main>
        <footer class="footer">MK - 2026</footer>

        <!-- TODO: Adds url parameters? And if they are here, then if it load the page with them, it is already open? -->
        <div class="contact-modal">
            <div class="contact-modal__background"></div>
            <div class="contact-modal__card">
                <h3>Contact me</h3>
                <button class="contact-modal__close">X</button>
            </div>
        </div>
    </body>
</html>
